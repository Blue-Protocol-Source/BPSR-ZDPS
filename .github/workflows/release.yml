# Automatic release workflow: tags in v.YYYY-MM-DD.r{run_number} format and matrix publish
name: Release (auto-tag, multi-rid matrix)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # Setup .NET
      # -------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      # -------------------------------------------------
      # Generate versions
      # -------------------------------------------------
      - name: Generate versions
        shell: pwsh
        run: |
          $dateTag = Get-Date -Format "yyyy-MM-dd"
          $dateDotnet = Get-Date -Format "yyyy.MM.dd"
          $run = "${{ github.run_number }}"

          "RELEASE_VERSION=v.$dateTag.r$run" >> $env:GITHUB_ENV
          "DOTNET_VERSION=$dateDotnet.$run" >> $env:GITHUB_ENV

      # -------------------------------------------------
      # Get commit information
      # -------------------------------------------------
      - name: Get commit information
        shell: pwsh
        run: |
          $commitHash = git rev-parse --short HEAD
          $commitMessage = git log -1 --pretty=%B
          $commitAuthor = git log -1 --pretty=%an
          $commitDate = git log -1 --pretty=%ai
          $totalCommits = git rev-list --count HEAD

          "COMMIT_HASH=$commitHash" >> $env:GITHUB_ENV
          "COMMIT_MESSAGE=$commitMessage" >> $env:GITHUB_ENV
          "COMMIT_AUTHOR=$commitAuthor" >> $env:GITHUB_ENV
          "COMMIT_DATE=$commitDate" >> $env:GITHUB_ENV
          "TOTAL_COMMITS=$totalCommits" >> $env:GITHUB_ENV

      # -------------------------------------------------
      # Restore
      # -------------------------------------------------
      - name: Restore
        run: dotnet restore -p:Version=${{ env.DOTNET_VERSION }}

      # -------------------------------------------------
      # Publish ALL variants
      # -------------------------------------------------
      - name: Publish variants
        shell: pwsh
        run: |
          $variants = @(
            @{ rid = "win-x64"; self = $true;  label = "self-contained" },
            @{ rid = "win-x64"; self = $false; label = "framework-dependent" },
            @{ rid = "win-x86"; self = $true;  label = "self-contained" },
            @{ rid = "win-x86"; self = $false; label = "framework-dependent" }
          )

          foreach ($v in $variants) {
            $out = "publish/$($v.rid)-$($v.label)"
            Write-Host "Publishing $($v.rid) / $($v.label)"

            dotnet publish "BPSR-ZDPS/BPSR-ZDPS.csproj" `
              -r $v.rid `
              -c Release `
              -o $out `
              -p:Version=${{ env.DOTNET_VERSION }} `
              -p:PublishSingleFile=true `
              -p:PublishTrimmed=false `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              --self-contained $v.self

            Get-ChildItem $out -Filter *.pdb -Recurse | Remove-Item -Force
          }

      # -------------------------------------------------
      # Create ZIPs
      # -------------------------------------------------
      - name: Create ZIPs
        shell: pwsh
        run: |
          $zips = @()

          Get-ChildItem publish -Directory | ForEach-Object {
            $zip = "ZDPS-${{ env.RELEASE_VERSION }}-$($_.Name).zip"
            Compress-Archive "$($_.FullName)\*" $zip
            $zips += $zip
          }

          $delimiter = "EOF"
          "ZIP_LIST<<$delimiter" >> $env:GITHUB_ENV
          ($zips -join "`n") >> $env:GITHUB_ENV
          $delimiter >> $env:GITHUB_ENV


      # -------------------------------------------------
      # Upload artifacts (optional)
      # -------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZDPS-${{ env.RELEASE_VERSION }}
          path: ZDPS-${{ env.RELEASE_VERSION }}-*.zip

      # -------------------------------------------------
      # Create GitHub Release (ONE time)
      # -------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ZDPS ${{ env.RELEASE_VERSION }}
          body: |
            ## BPSR ZDPS Release

            **Version:** `${{ env.RELEASE_VERSION }}`
            **Dotnet Version:** `${{ env.DOTNET_VERSION }}`

            ### Release Information
            **Release Date:** `${{ env.COMMIT_DATE }}`
            **Total Commits:** `${{ env.TOTAL_COMMITS }}`

            ### Latest Commit
            - **Hash:** `${{ env.COMMIT_HASH }}`
            - **Author:** `${{ env.COMMIT_AUTHOR }}`
            - **Message:** `${{ env.COMMIT_MESSAGE }}`

            ### Build Details
            - **Platform:** Windows (x64, x86)
            - **Build Type:** Single-file executables
            - **Optimization:** Release configuration
            - **Debug Symbols:** Removed for smaller file size

            ### Included Builds
            - Windows x64 / x86
            - Self-contained & Framework-dependent
            - Single-file publish

            ### Build Variants Explained
            | Variant | Description | Size | Requirements |
            |---------|-------------|------|---------------|
            | Self-contained x64 | Includes .NET 8 runtime | ~150MB | Windows x64 only |
            | Framework-dependent x64 | Requires .NET 8+ installed | ~20MB | .NET 8 Runtime |
            | Self-contained x86 | Includes .NET 8 runtime | ~140MB | Windows x86 only |
            | Framework-dependent x86 | Requires .NET 8+ installed | ~15MB | .NET 8 Runtime |

            ### System Requirements
            **Self-contained:** Windows 7 SP1 or later (x64 or x86)
            **Framework-dependent:** Windows 7 SP1 or later with .NET 8 Runtime installed

            
            ## ⚠️ Important Prerequisites
            ## ⚠️ Before Running ZDPS

            **Npcap is REQUIRED.**
            Download and install Npcap: https://npcap.com/#download

            If the game was already running, restart it after installing Npcap.

            **Framework-dependent builds also require .NET Desktop Runtime 9 (x64).**
            Self-contained builds include the runtime.
            

            ### Notes
            - Self-contained builds include .NET runtime and work standalone
            - Framework-dependent builds require .NET 8+ to be installed
            - All executables are single-file for easier distribution
            - Debug symbols have been removed to reduce file size
            - Choose x64 for 64-bit systems, x86 for 32-bit systems
          files: |
            ZDPS-${{ env.RELEASE_VERSION }}-win-x64-self-contained.zip
            ZDPS-${{ env.RELEASE_VERSION }}-win-x64-framework-dependent.zip
            ZDPS-${{ env.RELEASE_VERSION }}-win-x86-self-contained.zip
            ZDPS-${{ env.RELEASE_VERSION }}-win-x86-framework-dependent.zip
